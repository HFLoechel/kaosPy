[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "kaosPy"
version = "0.0.1"
authors = [
  { name="Hannah Franziska Löchel", email="hannahfranziska.loechel@uni-muenster.de" },
]
description = "Python package for encoding sequences using chaos game representation."
readme = "README.md"
requires-python = ">=3.10,<4"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]

[project.urls]
Homepage = "https://github.com/HFLoechel/kaosPy"
Issues = "https://github.com/HFLoechel/kaosPy/issues"