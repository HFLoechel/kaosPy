[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "kaosPy"
version = "0.0.1"
authors = [
  { name="Hannah Franziska Löchel" },
]
maintainers = [
  { name="Hannah Franziska Löchel"},
]
description = "Python package for encoding sequences using chaos game representation."
keywords = ["chaos game representation", "cgr", "frequency chaos game represantation", "fcgr", "sequnece embedding"]

readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]

[project.urls]
Repository = "https://github.com/HFLoechel/kaosPy"